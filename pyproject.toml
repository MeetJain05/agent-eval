[project]
name = "langchain-agent-evaluation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamad-Hachem", email = "mohamad27hachem@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "deepeval[inspect]>=4.2.8",
    "google-genai>=2.32.0",
    "groq>=0.37.1",
    "huggingface-hub>=1.16.1",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.0",
    "portalocker[win32]>=4.4.0",
]

[project.scripts]
langchain-agent-evaluation-system = "langchain_agent_evaluation_system:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
